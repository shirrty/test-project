# 保存为 UTF-8（无 BOM）：记事本另存为时选「UTF-8」，不要选「UTF-8 with BOM」
# 否则 configparser 会报 MissingSectionHeaderError

[llm]
base_url = https://api.deepseek.com/v1
api_key =
model = deepseek-chat
# 上下文窗口（token）。留空则先问模型 API 的 /models，拿不到就按 128k，
# 并在状态栏显示「默认」。写法示例：128k / 65536 / 131072
context_window =

[search]
# 百度千帆 AI 搜索的 API Key（不填则 searchWeb 只会返回提示，不会报错）
baidu_qianfan_api_key =

[skills]
# 技能根目录：每个子目录是一个技能，内含 SKILL.md
# 留空则使用 项目根目录\.agents\skills
dir =

[context]
# /compact 的上下文归档目录（每次压缩写一个 <编号>.jsonl）
# 留空则使用 项目根目录\.agents\context
dir =

[sessions]
# /save /new /resume 的会话存档目录，留空则用 .agents/sessions
dir = .agents/sessions

[agent]
# 长期规则文件（会作为一条 user 消息注入，整个会话只注入一次）
# 留空则按 AGENT.md → AGENTS.md → .agents/AGENT.md 顺序自动查找
# 也可以写死路径，支持环境变量，例如 %USERPROFILE%\rules\AGENT.md
instructions_file =
# 注入时的字符上限，超出会截断并标注原文长度
max_chars = 8000
