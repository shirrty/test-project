# 保存为 UTF-8（无 BOM）：记事本另存为时选「UTF-8」，不要选「UTF-8 with BOM」
# 否则 configparser 会报 MissingSectionHeaderError

[llm]
base_url = https://api.deepseek.com/v1
api_key =
model = deepseek-chat

[search]
# 百度千帆 AI 搜索的 API Key（不填则 searchWeb 只会返回提示，不会报错）
baidu_qianfan_api_key =

[skills]
# 技能根目录：每个子目录是一个技能，内含 SKILL.md
# 留空则使用 项目根目录\.agents\skills
dir = D:\office\.agents\skills
